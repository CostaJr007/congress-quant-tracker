[project]
name = "congress-quant-tracker"
version = "2.1.0"
description = "Congressional Trading Intelligence — Track every House & Senate trade with suspicion scoring"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.32.0",
    "sqlalchemy>=2.0.27",
    "pdfplumber>=0.10.3",
    "anthropic>=0.34.0",
    "yfinance>=0.2.36",
    "requests>=2.31.0",
    "pandas>=2.2.0",
    "numpy>=1.26.3",
    "plotly>=5.18.0",
    "python-dotenv>=1.0.1",
    "apscheduler>=3.10.4",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.1.0",
    "tenacity>=8.2.3",
    "tqdm>=4.66.2",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pyyaml>=6.0",
    "playwright>=1.62.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
